name: Android Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run unit tests
        run: gradle testDebugUnitTest

      - name: Build debug APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: gradle assembleDebug

      - name: Compact and sign debug APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          ALIGNED=app/build/outputs/apk/debug/app-debug-aligned.apk
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$APK" "$ALIGNED"
          mv "$ALIGNED" "$APK"
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-pass pass:android --key-pass pass:android "$APK"
          "$BUILD_TOOLS/apksigner" verify "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cairn-solo-rpg-debug
          path: app/build/outputs/apk/debug/app-debug.apk

name: Android Build

on:
  push:
    branches: ["main", "feat/cairn-visual-guardian-v1"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run unit tests
        run: gradle testDebugUnitTest

      - name: Test Guardian server
        run: gradle :guardian-server:test

      - name: Build optimized release APK
        run: gradle assembleRelease

      - name: Upload optimized release APK
        uses: actions/upload-artifact@v4
        with:
          name: cairn-solo-rpg-release
          path: app/build/outputs/apk/release/app-release.apk

name: Android Build

on:
  push:
    branches: ["feat/cairn-visual-guardian-v1", "feat/interactive-roll-flow"]
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run unit tests
        run: gradle testDebugUnitTest

      - name: Test Guardian server
        run: gradle :guardian-server:test

      - name: Integration test Guardian HTTP endpoint
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PORT: 18080
        run: |
          set -euo pipefail
          if [[ -z "${GEMINI_API_KEY:-}" ]]; then
            echo "GEMINI_API_KEY secret is not configured for this repository." >&2
            exit 1
          fi
          gradle :guardian-server:installDist
          PORT="$PORT" GEMINI_API_KEY="$GEMINI_API_KEY" \
            guardian-server/build/install/guardian-server/bin/guardian-server \
            > "$RUNNER_TEMP/cairn-guardian.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent "http://127.0.0.1:$PORT/health" > /dev/null; then
              break
            fi
            if [[ "$attempt" == "30" ]]; then
              cat "$RUNNER_TEMP/cairn-guardian.log" >&2
              exit 1
            fi
            sleep 1
          done
          guardian-server/scripts/integration-test.sh "http://127.0.0.1:$PORT"

      - name: Build optimized release APK
        run: gradle :app:assembleRelease

      - name: Verify APK output
        shell: bash
        run: |
          set -e
          ls -lah app/build/outputs/apk/release/
          test -f app/build/outputs/apk/release/app-release.apk

      - name: Upload optimized release APK
        uses: actions/upload-artifact@v4
        with:
          name: cairn-solo-rpg-release-v0.2.0
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

# Force a fresh test APK from the current Guardian branch state.

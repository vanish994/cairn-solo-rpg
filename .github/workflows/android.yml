name: Android Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run unit tests
        run: gradle testDebugUnitTest

      - name: Test Guardian server
        run: gradle :guardian-server:test

      - name: Integration test local Guardian and Gemini contract
        run: bash guardian-server/scripts/local-integration-test.sh

      - name: Build optimized release APK
        run: gradle :app:assembleRelease

      - name: Verify APK output
        shell: bash
        run: |
          set -e
          ls -lah app/build/outputs/apk/release/
          test -f app/build/outputs/apk/release/app-release.apk

      - name: Upload optimized release APK
        uses: actions/upload-artifact@v4
        with:
          name: cairn-solo-rpg-release-v0.2.0
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

# PR/build CI uses a deterministic local Gemini stub; production smoke is a separate manual workflow.
